name: 2. Training & Docker Build (Advance)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

env:
  # Mengambil rahasia dari GitHub Settings
  MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
  MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
  DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
  DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
  MLFLOW_TRACKING_URI: "https://dagshub.com/hooddz1/eksperimen_MSML_hudan-maulana-v2.mlflow"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Ambil Kodingan
    - name: Checkout Code
      uses: actions/checkout@v3

    # 2. Siapkan Python
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    # 3. Install dependencies
    - name: Install Libraries
      run: |
        pip install mlflow dagshub pandas scikit-learn virtualenv

    # 4. Login ke Docker Hub (Agar bisa upload image)
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: "huudz"
        password: ${{ secrets.DOCKER_PASSWORD }}

    
    

    
    - name: Run Training Script Directly
      env:
        DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
        DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
        MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
      run: |
        echo "Menjalankan training..."
        cd workflow-ci/MLProject
        # Tambahkan 'boto3' karena sering dibutuhkan untuk koneksi DagsHub
        pip install pandas scikit-learn mlflow dagshub boto3
        
        # Jalankan script
        python modelling.py --n_estimators 100 --max_depth 10

    
    - name: Upload Model Artifact (Internal)
      uses: actions/upload-artifact@v3
      with:
        name: my-trained-model
        path: workflow-ci/MLProject/model_output
        retention-days: 1

    
    - name: Download Model Artifact (Internal)
      uses: actions/download-artifact@v3
      with:
        name: my-trained-model
        path: downloaded_model

    
    - name: Build & Push Docker Image
      run: |
        # GANTI username di bawah ini dengan punya kamu!
        IMAGE_NAME="MASUKKAN_USERNAME_DOCKERMU_DISINI/clv-model-hudan:latest"
        
        echo "Membangun Docker Image dari artifact lokal..."
        ls -R downloaded_model # Cek isi folder (Debug)
        
        # Build menggunakan path lokal (-m menunjuk ke folder hasil download)
        mlflow models build-docker \
          -m "downloaded_model" \
          -n "$IMAGE_NAME" \
          --enable-mlserver

        echo "Mengupload ke Docker Hub..."
        docker push "$IMAGE_NAME"