name: 2. Training & Docker Build (Advance)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Agar bisa dijalankan manual tombol klik

env:
  # Mengambil rahasia dari GitHub Settings
  MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
  MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
  DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
  DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
  MLFLOW_TRACKING_URI: "https://dagshub.com/hooddz1/eksperimen_MSML_hudan-maulana-v2.mlflow"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Ambil Kodingan
    - name: Checkout Code
      uses: actions/checkout@v3

    # 2. Siapkan Python
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    # 3. Install dependencies
    - name: Install Libraries
      run: |
        pip install mlflow dagshub pandas scikit-learn virtualenv

    # 4. Login ke Docker Hub (Agar bisa upload image)
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: "huudz"
        password: ${{ secrets.DOCKER_PASSWORD }}

    
    - name: Run MLflow Project (Training)
      run: |
        echo "Sedang menjalankan training model..."
        
        
        cd workflow-ci/MLProject
        
        
        mlflow run . --env-manager=local --experiment-name="Eksperimen_CI_Automatic_Run"

    
    - name: Download Model & Build Docker
      run: |
        # 1. Gunakan Python untuk Download Model (Karena Python Auth-nya sudah sukses)
        python -c "
        import mlflow
        import os
        
        # Setup Koneksi
        dagshub_uri = '${{ env.MLFLOW_TRACKING_URI }}'
        mlflow.set_tracking_uri(dagshub_uri)
        
        print(f'Mencari run di: {dagshub_uri}')
        
        # Cari Run Terakhir
        runs = mlflow.search_runs(experiment_names=['Eksperimen_CI_Automatic_Run'])
        if runs.empty:
            raise Exception('Tidak ada run yang ditemukan!')
            
        last_run_id = runs.iloc[0].run_id
        print(f'Run ID ditemukan: {last_run_id}')
        
      
        local_path = mlflow.artifacts.download_artifacts(run_id=last_run_id, artifact_path='model', dst_path='./model_download')
        print(f'Model sukses didownload ke: {local_path}')
        "
        
        # 2. Build Docker dari File Lokal (Bukan dari Internet/URI)
        # Kita arahkan path (-m) ke folder hasil download tadi
        
        
        IMAGE_NAME="huudz/clv-model-hudan:latest"
        
        echo "Membangun Docker Image dari file lokal..."
        
        
        mlflow models build-docker \
          -m "./model_download/model" \
          -n "$IMAGE_NAME" \
          --enable-mlserver

        # 3. Upload
        echo "Mengupload ke Docker Hub..."
        docker push "$IMAGE_NAME"